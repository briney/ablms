name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the checkout.
permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No project dependencies needed, so skip the editable install entirely.
      # These versions are hand-copied from pyproject.toml's [project.optional-
      # dependencies].dev extra -- keep the two pins in step, or a pin bump in
      # one will not propagate to the other.
      - run: pip install ruff==0.16.2 black==26.5.1
      - run: ruff check src/ tests/
      - run: black --check src/ tests/

  typecheck:
    name: typecheck (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ty resolves third-party imports through the environment, so the real
      # dependencies must be installed. The CPU index avoids a ~2.5 GB CUDA wheel.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: ty check src/ --output-format github

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: python -m pytest -m "not slow"

  smoke:
    name: smoke (bundled weights)
    runs-on: ubuntu-latest
    # Blocking. IgLM and AntiBERTy bundle their weights, so these run offline
    # with no GPU, and both models are now functional under transformers 5.x.
    # This job previously carried continue-on-error: true while they were
    # broken; that setting made the job report success to branch protection
    # regardless of outcome, so it has been removed rather than merely
    # un-marked. Add `smoke (bundled weights)` to the required checks.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: python -m pytest -m smoke
