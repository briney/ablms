[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ablms"
version = "0.1.1"
description = "Unified API for antibody language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Bryan Briney", email = "bryan.briney@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "antibody",
    "language-model",
    "deep-learning",
    "bioinformatics",
    "immunology",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "antiberty>=0.0.4",
    "ablang2>=0.1.0",
    "iglm>=0.1.0",
    "rjieba"  # required for transformers RoFormer model (AntiBERTa2)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Tooling is pinned exactly: ty and ruff are pre-1.0 and change diagnostics
    # between releases, so an unpinned bump would break CI on someone else's
    # release schedule rather than on a change here.
    # The lint job in .github/workflows/ci.yml installs ruff/black directly
    # (skipping this extra) with its own hard-coded versions -- keep the two
    # pins in step, or the lint job silently checks with a stale tool.
    "black==26.5.1",
    "ruff==0.16.2",
    "ty==0.0.40",
]

[project.urls]
Homepage = "https://github.com/briney/ablms"
Documentation = "https://github.com/briney/ablms#readme"
Repository = "https://github.com/briney/ablms"
Issues = "https://github.com/briney/ablms/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ablms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that load real model weights (deselect with '-m \"not slow\"')",
    "smoke: marks tests that instantiate bundled-weight models offline (implies slow)",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: line length is enforced by the formatter, not the linter.
# N812: `import torch.nn.functional as F` is the universal PyTorch convention.
ignore = ["E501", "N812"]

