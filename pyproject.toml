[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ablms"
version = "0.0.1"
description = "Unified API for antibody language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Bryan Briney", email = "bryan.briney@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "antibody",
    "language-model",
    "deep-learning",
    "bioinformatics",
    "immunology",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "antiberty>=0.0.4",
    "ablang2>=0.1.0",
    "iglm>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/bryanbriney/ablms"
Documentation = "https://github.com/bryanbriney/ablms#readme"
Repository = "https://github.com/bryanbriney/ablms"
Issues = "https://github.com/bryanbriney/ablms/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ablms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
